name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Both jobs run from a clean clone with no secrets and no keys. The browser suite in web/e2e is not run
# here: its real-day specs read festival data that is not in the repository.

jobs:
  web:
    name: web (types, unit tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npx next typegen && npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  backend:
    name: backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Agent runs stay off; no key of any kind is set.
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q
